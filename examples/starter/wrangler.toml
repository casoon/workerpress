name = "workerpress-starter"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "workerpress-starter"
database_id = "REPLACE_ME"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "workerpress-starter-media"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_ME"

# Optional: async Events / Webhooks
# [[queues.producers]]
# binding = "JOBS"
# queue = "workerpress-starter-jobs"
